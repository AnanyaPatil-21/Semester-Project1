<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | CampusPlus</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto:wght@400;500&display=swap"
        rel="stylesheet">

    <!-- Login CSS -->
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

    <!-- Header -->
    <header class="header">

        <div class="logo">
            <a href="../index.html">CampusPlus</a>
        </div>

        <a href="../index.html" class="home-link">Home</a>

    </header>


    <!-- Login Section -->
    <main class="login-container">

        <div class="login-card">

            <!-- Heading -->
            <div class="login-heading">

                <p class="welcome-text">WELCOME BACK</p>

                <h1>Login to CampusPlus</h1>

                <p>
                    Access your campus account and stay connected.
                </p>

            </div>


            <!-- Role Selection -->
            <div class="role-selection">

                <button type="button" class="role-btn active" id="studentBtn">
                    Student
                </button>

                <button type="button" class="role-btn" id="adminBtn">
                    Admin
                </button>

            </div>


            <!-- Login Form -->
            <form id="loginForm">

                <!-- Email -->
                <div class="form-group">

                    <label for="email" id="emailLabel">
                        Student Email ID
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your student email"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- Options -->
                <div class="form-options">

                    <label class="remember-me">

                        <input type="checkbox" id="remember">

                        Remember me

                    </label>

                    <a href="#" class="forgot-password">
                        Forgot Password?
                    </a>

                </div>


                <!-- Login Button -->
                <button type="submit" class="login-btn">
                    Login
                </button>

            </form>


            <!-- Student Registration -->
            <div class="register-link" id="registerSection">

                <p>
                    Don't have an account?
                    <a href="registration.html">
                        Create an account
                    </a>
                </p>

            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer class="footer">

        <p>
            © 2026 CampusPlus. Smart Campus Management System.
        </p>

    </footer>


    <!-- Login JavaScript -->
    <script src="../js/login.js"></script>

</body>

</html>
